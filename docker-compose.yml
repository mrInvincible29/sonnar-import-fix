services:
  sonarr-import-monitor:
    image: ghcr.io/mrinvincible29/sonnar-import-fix:latest
    container_name: sonarr-import-monitor

    # Security settings
    user: "1000:1000"
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true

    # Allow access to host services
    extra_hosts:
      - "host.docker.internal:host-gateway"

    # Environment variables
    environment:
      - APP_TYPE=sonarr
      - SONARR_URL=${SONARR_URL:?Please set SONARR_URL}
      - SONARR_API_KEY=${SONARR_API_KEY:?Please set SONARR_API_KEY}

      # Webhook settings
      - WEBHOOK_ENABLED=${WEBHOOK_ENABLED:-true}
      - WEBHOOK_HOST=${WEBHOOK_HOST:-0.0.0.0}
      - WEBHOOK_PORT=${WEBHOOK_PORT:-8090}
      - WEBHOOK_SECRET=${WEBHOOK_SECRET:-}
      - WEBHOOK_IMPORT_CHECK_DELAY=${WEBHOOK_IMPORT_CHECK_DELAY:-600}

      # Monitoring settings
      - MONITORING_INTERVAL=${MONITORING_INTERVAL:-60}
      - FORCE_IMPORT_THRESHOLD=${FORCE_IMPORT_THRESHOLD:-10}
      - REMOVE_PUBLIC_FAILURES=${REMOVE_PUBLIC_FAILURES:-true}
      - PROTECT_PRIVATE_RATIO=${PROTECT_PRIVATE_RATIO:-true}

      # Logging settings
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - LOG_FORMAT=${LOG_FORMAT:-json}

      # Python settings
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1

      # Optional: Dry run mode
      - DRY_RUN=${DRY_RUN:-false}

    # Port mapping
    ports:
      - "${WEBHOOK_PORT:-8090}:${WEBHOOK_PORT:-8090}"

    # Volume mounts
    volumes:
      - ./logs:/app/logs
      - /tmp

    restart: unless-stopped

    healthcheck:
      test: ["CMD-SHELL", "test -f /proc/1/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    labels:
      - "com.docker.compose.project=sonarr-import-monitor"
      - "version=2.0.0"

  radarr-import-monitor:
    image: ghcr.io/mrinvincible29/sonnar-import-fix:latest
    container_name: radarr-import-monitor

    # Security settings
    user: "1000:1000"
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true

    extra_hosts:
      - "host.docker.internal:host-gateway"

    environment:
      - APP_TYPE=radarr
      - RADARR_URL=${RADARR_URL:?Please set RADARR_URL}
      - RADARR_API_KEY=${RADARR_API_KEY:?Please set RADARR_API_KEY}

      # No webhook for Radarr
      - WEBHOOK_ENABLED=false

      # Monitoring settings
      - MONITORING_INTERVAL=${MONITORING_INTERVAL:-60}
      - FORCE_IMPORT_THRESHOLD=${FORCE_IMPORT_THRESHOLD:-10}
      - REMOVE_PUBLIC_FAILURES=${REMOVE_PUBLIC_FAILURES:-true}
      - PROTECT_PRIVATE_RATIO=${PROTECT_PRIVATE_RATIO:-true}

      # Logging settings
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - LOG_FORMAT=${LOG_FORMAT:-json}

      # Python settings
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1

      - DRY_RUN=${DRY_RUN:-false}

    volumes:
      - ./logs:/app/logs
      - /tmp

    restart: unless-stopped

    # No webhook port needed for Radarr
    command: ["--app-type", "radarr"]

    healthcheck:
      test: ["CMD-SHELL", "test -f /proc/1/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    labels:
      - "com.docker.compose.project=sonarr-import-monitor"
      - "version=2.0.0"

networks:
  default:
    name: sonarr-import-monitor
    driver: bridge
